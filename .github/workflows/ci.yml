name: Native binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each target has its own hosted VM; local builds remain capped at two jobs.
      max-parallel: 6
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
            python: python
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      PYTHONUTF8: "1"
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
      NATIVE_TARGET: ${{ matrix.target }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.arch }}
      # Build the exact reviewed head, rather than GitHub's synthetic merge ref.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install Linux GUI build and runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libclang-dev libgtk-3-dev libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev

      - name: Install native Rust and verify runner architecture
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          actual_host=$(rustc --version --verbose | tr -d '\r' | sed -n 's/^host: //p')
          test "$actual_host" = "$NATIVE_TARGET"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustc --version --verbose
          cargo --version

      - name: Test CPU benchmark harness (no GPU)
        run: ${{ matrix.python }} scripts/pipeline_latency_bench.py --self-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run native release tests
        run: cargo test --locked --release --all-targets --target "$NATIVE_TARGET" --jobs 2

      - name: Build native release binary
        run: cargo build --locked --release --bin ironvnc --target "$NATIVE_TARGET" --jobs 2

      - name: Test native binary against isolated loopback RFB fixture
        run: |
          binary="target/$NATIVE_TARGET/release/ironvnc"
          if [[ "$RUNNER_OS" = Windows ]]; then binary="$binary.exe"; fi
          ${{ matrix.python }} scripts/rfb_fixture.py --binary "$binary"

      - name: Smoke-test and package binary
        env:
          CI_VERIFICATION_COMPLETED: native-release-tests,loopback-rfb-fixture
        run: ${{ matrix.python }} scripts/ci-package.py --target "$NATIVE_TARGET" --runner "${{ matrix.runner }}"

      - name: Upload binary, documentation, and SHA256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ironvnc-${{ matrix.target }}-${{ env.SOURCE_SHA }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-nightly:
    name: Publish verified Nightly prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all six validated native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ironvnc-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Verify complete packages, hashes, and source provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          sha = os.environ["GITHUB_SHA"]
          targets = [
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "aarch64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "aarch64-pc-windows-msvc",
          ]
          directory = Path("dist")
          expected = set()
          for target in targets:
              package = f"ironvnc-{target}-{sha[:12]}"
              suffix = ".zip" if "windows" in target else ".tar.gz"
              archive = directory / (package + suffix)
              checksum = directory / (archive.name + ".sha256")
              expected.update((archive.name, checksum.name))
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              if checksum.read_text(encoding="utf-8") != f"{digest}  {archive.name}\n":
                  raise ValueError(f"SHA256 mismatch: {archive}")
              manifest_name = f"{package}/BUILD-INFO.json"
              if suffix == ".zip":
                  with zipfile.ZipFile(archive) as contents:
                      manifest = json.loads(contents.read(manifest_name))
              else:
                  with tarfile.open(archive, "r:gz") as contents:
                      with contents.extractfile(manifest_name) as manifest_file:
                          manifest = json.load(manifest_file)
              if manifest["source_commit"] != sha or manifest["target"] != target:
                  raise ValueError(f"Unexpected source or architecture: {archive}")
              if set(manifest["prior_ci_verification"]) != {"native-release-tests", "loopback-rfb-fixture"}:
                  raise ValueError(f"Missing native tests: {archive}")
              if manifest["missing_third_party_notice_documents"] != 0:
                  raise ValueError(f"Incomplete license notices: {archive}")
          actual = {path.name for path in directory.iterdir() if path.is_file()}
          if actual != expected:
              raise ValueError(f"Missing or unexpected release assets: {sorted(expected ^ actual)}")
          print(f"Verified {len(targets)} native packages and {len(expected)} release assets for {sha}")
          PY

      - name: Publish immutable Nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="nightly-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != true ]]; then
              echo "Existing published Nightly $tag is immutable; skipping upload."
              exit 0
            fi
          else
            gh release create "$tag" \
              --draft --prerelease --target "$GITHUB_SHA" \
              --title "Nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:12})" \
              --notes "Automated main-branch prerelease from commit $GITHUB_SHA. All six native release builds, tests, and packaged archives passed CI. Binaries are unsigned and unnotarized. See https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/SUPPORT.md for verification limits."
          fi
          gh release upload "$tag" dist/* --clobber
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt
          gh release edit "$tag" --draft=false --prerelease
          echo "Nightly: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
